name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Fast signals that block merge: format, lint, type-check, unit tests.
  # Kept on ubuntu-latest only (same results cross-platform for these steps).
  # ---------------------------------------------------------------------------
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Shared with release.yml's verify job so a tag build reuses this.
          shared-key: linux-workspace
          workspaces: |
            .
            src-tauri
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  typescript:
    name: typescript + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No `version:` input — it conflicts with `packageManager` in
      # package.json and the action refuses to guess between them.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run check
      - run: pnpm -r run lint
      - run: pnpm -r run test

  # ---------------------------------------------------------------------------
  # Dependency vulnerability audit. Kept separate so we can mark it
  # "required" for merge or not, without tying to the rest of CI.
  # ---------------------------------------------------------------------------
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      # `--deny warnings` so an unmaintained crate fails the build too, not
      # just a vulnerability. The advisories we cannot act on are enumerated
      # one by one in `.cargo/audit.toml`, each with the reason and the
      # condition for deleting it; anything outside that list breaks CI.
      - name: cargo audit
        run: cargo audit --deny warnings
      # No `version:` input — it conflicts with `packageManager` in
      # package.json and the action refuses to guess between them.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
